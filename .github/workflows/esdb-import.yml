name: ESDB Import (Manual)

on:
  workflow_dispatch:
    inputs:
      checkout_url:
        description: 'ESDB repo URL (must be branch v2 with make completed)'
        required: true
        default: 'https://github.com/en-wl/wordlist.git'
      size:
        description: 'Size band (60 or 70)'
        required: true
        default: '60'
        type: choice
        options: ['60', '70']
      spellings:
        description: 'Spelling codes (A, B, B,Z, etc.)'
        required: true
        default: 'A'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WhatWord
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ESDB
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.checkout_url }}
          ref: 'v2'
          path: esdb
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-venv aspell libaspell-dev make

      - name: Build ESDB
        working-directory: esdb
        run: make

      - name: Ingest into WhatWord
        run: |
          node scripts/ingest-esdb.mjs \
            --checkout=./esdb \
            --size=${{ github.event.inputs.size }} \
            --spellings=${{ github.event.inputs.spellings }} \
            --emit

      - name: Commit generated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/esdb-corpus.generated.ts
          git diff --staged --quiet || git commit -m "chore: ESDB import size ${{ github.event.inputs.size }} spellings ${{ github.event.inputs.spellings }} (commit $(cat ./esdb/.git/ORIG_HEAD 2>/dev/null || echo 'unknown'))"
          git push

      - name: Summary
        run: echo "ESDB corpus committed. Next build will include the updated word graph."