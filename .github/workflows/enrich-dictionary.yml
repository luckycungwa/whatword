name: Enrich Dictionary (FreeDictionaryAPI)

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC — respects 1,000 req/h limit
  workflow_dispatch:
    inputs:
      limit:
        description: 'Words to enrich this run'
        required: true
        default: '300'
        type: string

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ENRICH_DELAY_MS: '500'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Enrich (batch)
        run: npm run enrich:dict -- --limit=${{ github.event.inputs.limit || 300 }}

      - name: Log summary
        run: echo "Batch complete — next run will pick up where we left off (already-enriched words are skipped)."